  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#grad)" />
  <g filter="url(#shadow)">
    <!-- Hammer Head -->
    <rect x="200" y="160" width="112" height="60" rx="10" fill="#f59e0b" />
    <!-- Hammer Handle -->
    <rect x="246" y="210" width="20" height="120" rx="5" fill="#f59e0b" />
    <!-- Text Elements -->
    <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="white">IPL</text>
  </g>
</svg>
